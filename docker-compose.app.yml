# Sarh APP SERVER stack — nginx, API, Socket.IO, BullMQ worker, web, admin ONLY
# (two-server production). PostgreSQL + Redis live on the data server
# (docker-compose.data.yml) and are reached over the private network /
# WireGuard tunnel at DATA_SERVER_PRIVATE_IP.
#
# Usage (on the app server, from /opt/sarh):
#   docker compose -f docker-compose.app.yml -f docker-compose.prod.ssl.yml \
#     --env-file .env.app up -d
#
# Same images, entrypoints, healthchecks and nginx config as docker-compose.prod.yml.
# Differences: no postgres/redis services; DB/Redis URLs point at the data
# server; Redis password is required; migrations are NOT run on start
# (SKIP_MIGRATIONS defaults to true — run scripts/app-server/migrate.sh explicitly).
#
# Requires .env.app (never commit). See .env.app.example
# POSTGRES_PASSWORD must be URL-safe (it is embedded in DATABASE_URL as-is).

name: sarh

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${DATA_SERVER_PRIVATE_IP:?set DATA_SERVER_PRIVATE_IP}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sarh}${DATABASE_URL_PARAMS:-}
  DIRECT_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${DATA_SERVER_PRIVATE_IP:?set DATA_SERVER_PRIVATE_IP}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sarh}${DIRECT_URL_PARAMS:-}
  # REDIS_URL takes precedence in src/redis/redis-connection.ts — force it empty
  # so a stale value in .env.app cannot bypass host/port/password below.
  REDIS_URL: ''
  REDIS_HOST: ${DATA_SERVER_PRIVATE_IP:?set DATA_SERVER_PRIVATE_IP}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  REDIS_ENABLED: 'true'

# Bounded json-file logs (default driver keeps growing until the disk is full).
# 5 x 20 MB per container; `docker compose up -d` recreates a service to apply it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    logging: *default-logging
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: sarh-backend:latest
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    env_file:
      - .env.app
    environment:
      <<: *backend-env
      SERVICE_MODE: api
      PORT: '3001'
      # Existing docker-entrypoint.sh flag. Two-server default: never migrate on
      # boot; schema changes are applied manually (scripts/app-server/migrate.sh).
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-true}
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - sarh_internal
    entrypoint: ['./docker-entrypoint.sh']
    healthcheck:
      # Existing GET /api/health (DB liveness) — no new health logic.
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    logging: *default-logging
    image: sarh-backend:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.75"
    env_file:
      - .env.app
    environment:
      <<: *backend-env
      SERVICE_MODE: worker
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sarh_internal
    entrypoint: ['node']
    command: ['dist/queue/worker.main.js']
    healthcheck:
      # Worker writes Redis key sarh:worker:heartbeat (WorkerHeartbeatService).
      test:
        [
          'CMD-SHELL',
          'node -e "const Redis=require(\"ioredis\"); const r=new Redis({host:process.env.REDIS_HOST||\"redis\",port:Number(process.env.REDIS_PORT||6379),password:process.env.REDIS_PASSWORD||undefined,maxRetriesPerRequest:1,lazyConnect:true,connectTimeout:3000}); r.connect().then(()=>r.get(\"sarh:worker:heartbeat\")).then(v=>{r.disconnect(); process.exit(v?0:1);}).catch(()=>{try{r.disconnect()}catch(_){} process.exit(1);})"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  socket:
    logging: *default-logging
    image: sarh-backend:latest
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.50"
    env_file:
      - .env.app
    environment:
      <<: *backend-env
      SERVICE_MODE: socket
      PORT: '3002'
      SOCKET_PORT: '3002'
      SOCKET_HTTP_PORT: '3002'
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3002:3002'
    networks:
      - sarh_internal
    entrypoint: ['node']
    command: ['dist/gateway/socket.main.js']
    healthcheck:
      # Existing SocketHealthController GET /health (no global api prefix).
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3002/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admin:
    logging: *default-logging
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sarhsa.online
        NEXT_PUBLIC_SOCKET_URL: https://sarhsa.online
        NEXT_PUBLIC_ADMIN_BASE_PATH: /admin
    image: sarh-admin:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      # Must match API JWT_SECRET — middleware verifies admin_token cookies.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      api:
        condition: service_started
    networks:
      - sarh_internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/admin/login\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    logging: *default-logging
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_WEB_SAME_ORIGIN: 'true'
        EXPO_PUBLIC_API_URL: ''
        EXPO_PUBLIC_SOCKET_URL: https://sarhsa.online
        EXPO_PUBLIC_AGORA_ENABLED: 'false'
    image: sarh-web:latest
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    networks:
      - sarh_internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HTTPS: add -f docker-compose.prod.ssl.yml (overrides nginx ports/volumes only).
  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    depends_on:
      - api
      - socket
      - admin
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl-redirect.conf:/etc/nginx/includes/ssl-redirect.conf:ro
      - ./nginx/admin-location.conf:/etc/nginx/includes/admin-location.conf:ro
      - ./nginx/web-location.conf:/etc/nginx/includes/web-location.conf:ro
      - ./nginx/payment-bridge.conf:/etc/nginx/includes/payment-bridge.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - sarh_internal

networks:
  sarh_internal:
    name: sarh_internal
    driver: bridge
