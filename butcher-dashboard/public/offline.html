<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1622" />
    <title>سرح | غير متصل</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1622;
        color: #f4f6f5;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        text-align: center;
      }
      h1 { color: #20b66f; font-size: 1.5rem; margin: 0 0 12px; }
      p { color: #94a3ac; margin: 0 0 20px; line-height: 1.7; }
      button {
        background: #20b66f;
        color: #0b1622;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 600;
        min-height: 44px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        لوحة الملاحم تحتاج اتصالاً مباشرًا بالخادم. لا نعرض طلبات أو عملاء أو تقارير قديمة.
        أعد المحاولة بعد عودة الشبكة.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
