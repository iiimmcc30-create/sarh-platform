# Optional HTTPS overlay for Hostinger production nginx.
# Usage after certbot succeeds:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.ssl.yml --env-file .env.production up -d nginx
#
# Requires certificates at /etc/letsencrypt on the host (see scripts/hostinger/06-setup-ssl.sh).

services:
  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl-redirect.conf:/etc/nginx/includes/ssl-redirect.conf:ro
      - ./nginx/nginx.ssl.server.conf:/etc/nginx/conf.d/ssl-server.conf:ro
      - ./nginx/admin-location.conf:/etc/nginx/includes/admin-location.conf:ro
      - ./nginx/butcher-location.conf:/etc/nginx/includes/butcher-location.conf:ro
      - ./nginx/join-location.conf:/etc/nginx/includes/join-location.conf:ro
      - ./nginx/web-location.conf:/etc/nginx/includes/web-location.conf:ro
      - ./nginx/payment-bridge.conf:/etc/nginx/includes/payment-bridge.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Bind-mount so host certbot and nginx share ACME webroot
      - /var/www/certbot:/var/www/certbot:ro
