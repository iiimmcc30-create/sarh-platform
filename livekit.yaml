# LiveKit server config for the dedicated media VPS (see docs/livekit.md).
# Keys are NOT stored here: docker-compose.media.yml passes them via LIVEKIT_KEYS.
# The webhook `api_key` below must equal LIVEKIT_API_KEY in .env.media ("sarh").
port: 7880
bind_addresses:
  - ""
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

turn:
  enabled: true
  domain: turn.getsarh.com
  tls_port: 5349
  udp_port: 3478
  cert_file: /certs/turn.getsarh.com.crt
  key_file: /certs/turn.getsarh.com.key

webhook:
  api_key: sarh
  urls:
    - https://getsarh.com/api/livekit/webhook

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
