server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static Expo export only. API/socket/admin are on the outer reverse proxy.

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  # App Links / Universal Links verification files (public/.well-known): JSON, never the SPA.
  location /.well-known/ {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
}
