name: EAS Dev Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'android | ios | all'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  eas-dev-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: EAS dev build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: Add EXPO_TOKEN to repository secrets (expo.dev → Access Tokens)"
            exit 1
          fi
          npx eas-cli build \
            --profile development \
            --platform "${{ github.event.inputs.platform }}" \
            --non-interactive
