name: Keep-alive

# Ping Hostinger production health endpoints so operators notice outages.
# (Previously targeted Render free-tier cold starts — no longer applicable.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: curl -fsS --retry 4 --retry-delay 8 --retry-all-errors --max-time 40 https://sarhsa.online/api/health
      - name: Ping nginx /health alias
        run: curl -fsS --retry 4 --retry-delay 8 --retry-all-errors --max-time 40 https://sarhsa.online/health
