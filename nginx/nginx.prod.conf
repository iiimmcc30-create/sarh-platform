map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker embedded DNS — resolve upstream hostnames per-request so recreating
# api/socket containers cannot leave nginx stuck on a stale unreachable IP (502).
resolver 127.0.0.11 valid=10s ipv6=off;

# sarhsa.online — HTTP (redirects to HTTPS after ssl.conf is enabled)
server {
  listen 80;
  server_name sarhsa.online www.sarhsa.online;

  client_max_body_size 32m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  include /etc/nginx/includes/ssl-redirect.conf;

  include /etc/nginx/includes/admin-location.conf;
  include /etc/nginx/includes/butcher-location.conf;

  location /privacy {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  location /api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/includes/payment-bridge.conf;

  location /socket.io/ {
    set $socket_upstream socket:3002;
    proxy_pass http://$socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  include /etc/nginx/includes/web-location.conf;
}

# Direct IP / pre-DNS fallback
server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;

  include /etc/nginx/includes/admin-location.conf;
