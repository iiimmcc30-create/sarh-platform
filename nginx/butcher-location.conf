# Butcher Next.js dashboard (same host, path prefix /butcher)
#
# Canonical URL is /butcher (no trailing slash). Next.js runs with
# basePath=/butcher and default trailingSlash=false, so /butcher/ returns 308 → /butcher.
# Never redirect /butcher → /butcher/ here — that conflicts with Next and loops:
#   nginx 302 /butcher → /butcher/  then  Next 308 /butcher/ → /butcher
location = /butcher {
  set $butcher_upstream butcher:3003;
  proxy_pass http://$butcher_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location /butcher/ {
  set $butcher_upstream butcher:3003;
  proxy_pass http://$butcher_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}
