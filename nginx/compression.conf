# Gzip for responses nginx itself serves (admin, web, well-known) and for
# proxied responses the API left uncompressed. Bodies that already have
# Content-Encoding (Nest Brotli or gzip) are passed through unchanged.
#
# ngx_brotli is not compiled into nginx:1.27-alpine. Brotli for JSON is
# applied in the API process (responseCompression in main.ts) when the
# client sends Accept-Encoding: br.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  text/xml
  image/svg+xml;
