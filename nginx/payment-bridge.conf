# N-Genius return/cancel: serve Expo web so the same-origin session can sync.
# Native in-app WebView intercepts these URLs before they render.
# Do not steal Expo /payment/checkout.
location = /payment/result {
  set $web_upstream web:80;
  proxy_pass http://$web_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /payment/cancel {
  set $web_upstream web:80;
  proxy_pass http://$web_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
