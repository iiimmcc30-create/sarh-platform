# Shared links (/l/:id, /post/:id, /u/:username): link-preview crawlers get the
# API's Open Graph page (title, price, 1200px image); people get the web app,
# which routes to the listing / post / profile (and opens the app via App Links).
location ~ ^/(l|post|u)/([^/?]+)/?$ {
  set $share_upstream web:80;
  if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|Snapchat|Applebot|Pinterest|SkypeUriPreview|redditbot|vkShare|Embedly|Iframely|Viber|Line/)") {
    set $share_upstream api:3001;
    rewrite ^/(l|post|u)/([^/?]+)/?$ /api/og/$1/$2 break;
  }
  proxy_pass http://$share_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Expo web app (static export). More-specific locations (/api, /admin, …) win.
location / {
  set $web_upstream web:80;
  proxy_pass http://$web_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
