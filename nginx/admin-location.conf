# Admin Next.js panel (same host, path prefix /admin)
#
# Canonical URL is /admin (no trailing slash). Next.js runs with
# basePath=/admin and default trailingSlash=false, so /admin/ returns 308 → /admin.
# Never redirect /admin → /admin/ here — that conflicts with Next and loops:
#   nginx 302 /admin → /admin/  then  Next 308 /admin/ → /admin
location = /admin {
  set $admin_upstream admin:3000;
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

location /admin/ {
  set $admin_upstream admin:3000;
  proxy_pass http://$admin_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}
