# getsarh.com is the primary public domain (since 2026-10-17).
# sarhsa.online stays up with its own certificate: API, sockets, uploads,
# payment return pages and app-link files are still served
# directly there (installed app builds and N-Genius callbacks use it); every
# other page 301-redirects to the same path on https://getsarh.com.

server {
  listen 443 ssl;
  http2 on;
  server_name getsarh.com;

  ssl_certificate /etc/letsencrypt/live/getsarh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/getsarh.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SarhSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 32m;

  include /etc/nginx/includes/compression.conf;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  include /etc/nginx/includes/admin-location.conf;

  location /privacy {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /delete-account {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  location /api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  include /etc/nginx/includes/payment-bridge.conf;

  location /socket.io/ {
    set $socket_upstream socket:3002;
    proxy_pass http://$socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  include /etc/nginx/includes/web-location.conf;
}

# www.getsarh.com → apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.getsarh.com;

  ssl_certificate /etc/letsencrypt/live/getsarh.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/getsarh.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SarhSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://getsarh.com$request_uri;
  }
}

# sarhsa.online (legacy) — keep machine endpoints, redirect pages to getsarh.com
server {
  listen 443 ssl;
  http2 on;
  server_name sarhsa.online www.sarhsa.online;

  ssl_certificate /etc/letsencrypt/live/sarhsa.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sarhsa.online/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SarhSSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 32m;

  include /etc/nginx/includes/compression.conf;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }


  location /api/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    set $api_upstream api:3001;
    proxy_pass http://$api_upstream/api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    set $socket_upstream socket:3002;
    proxy_pass http://$socket_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
  }

  # N-Genius return/cancel pages for orders created before the switch.
  include /etc/nginx/includes/payment-bridge.conf;

  # App Links / Universal Links verification for installed builds.
  location = /.well-known/assetlinks.json {
    alias /etc/nginx/well-known/assetlinks.json;
    types { }
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /.well-known/apple-app-site-association {
    alias /etc/nginx/well-known/apple-app-site-association;
    types { }
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Every web page (/, /admin, /privacy, /delete-account, /l/…, /u/…, /post/…) → getsarh.com
  location / {
    return 301 https://getsarh.com$request_uri;
  }
}
